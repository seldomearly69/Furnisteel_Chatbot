upstream furnisteel_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Optional: lets Meta verify callback even on HTTP if needed during setup.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Mount your cert/key to ./nginx/certs
    ssl_certificate /etc/nginx/certs/live/bot.fmfurnisteel.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bot.fmfurnisteel.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_pass http://furnisteel_app;
    }
}

server {
    listen 443 ssl;
    server_name dashboard.fmfurnisteel.com;

    ssl_certificate /etc/nginx/certs/live/bot.fmfurnisteel.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bot.fmfurnisteel.com/privkey.pem;
    
    location / {
        proxy_pass http://chat-ui:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
